      text: arXiv
      link: https://arxiv.org/abs/2609.39901

- id: arxiv:2609.33259
  type: preprint
  date: 2026-09-27
  description: "**GTRL (Grounded Transitive RL)** — an offline goal-conditioned value-learning algorithm that grounds divide-and-conquer updates with a one-step temporal-difference target, so every state–goal pair receives an update. Achieves the highest average success rate across nineteen OGBench tasks spanning stochastic, deterministic, and stitching environments."
  image: images/gtrl-method.jpg
  tags:
    - Reinforcement Learning
  buttons:
    - type: preprint
      text: arXiv
      link: https://arxiv.org/abs/2609.33259

